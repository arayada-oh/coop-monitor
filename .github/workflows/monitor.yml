name: Coop Website Daily Monitor

on:
  schedule:
    # ตั้งเวลารันอัตโนมัติทุกวัน เวลา 01:00 น. UTC (ตรงกับ 08:00 น. เวลาไทย)
    - cron: '0 1 * * *'
  workflow_dispatch: # ปุ่มสำหรับกดให้สคริปต์ทำงานเองแบบ Manual ได้ทันที

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Libraries
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pandas

    - name: Execute Python Script
      env:
        # ดึงค่าความลับที่เราจะเอาไปใส่ในระบบจัดการ Secrets ของ GitHub
        GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
      run: python monitor.py

